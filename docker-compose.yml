services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password_change_me
      POSTGRES_DB: personal_finance
    ports:
      - "5434:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  finance_postgres_data:
